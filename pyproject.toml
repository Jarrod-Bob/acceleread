# Workspace root (virtual: not itself a package). See docs/spec/v0.md §2.

[tool.uv.workspace]
members = ["packages/*", "examples/*"]

[tool.uv.sources]
acceleread = { workspace = true }
acceleread-eval = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# corpus/ holds one-off research scripts, not package code.
extend-exclude = ["corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["acceleread", "acceleread_eval"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/acceleread/src", "packages/acceleread-eval/src", "tools"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]  # ships no type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "psutil", "tesserocr", "edgar", "edgar.*", "docling", "docling.*", "huggingface_hub", "huggingface_hub.*"]  # no stubs or py.typed marker; edgar, docling and huggingface_hub are optional extras
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/acceleread/tests", "packages/acceleread-eval/tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
