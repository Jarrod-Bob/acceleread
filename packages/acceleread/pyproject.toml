[project]
name = "acceleread"
version = "0.1.0.dev0"
description = "Turn PDFs and HTML into structured, classified Document Records."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The acceleread Authors" }]
# Core is torch-free (ADR 0005). Contents follow docs/spec/v0.md §2.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lxml>=5.3",
    "psutil>=6.1",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "tesserocr>=2.11",
    "typesafe-sdk[http2]>=0.7.2",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
quality = [
    "docling-slim[convert-core,format-pdf,feat-ocr-rapidocr-onnx,models-local]>=2.133",
    # Direct so uv can pin them to the CPU-only index below (ADR 0005); pip users pass
    # --extra-index-url https://download.pytorch.org/whl/cpu.
    "torch>=2.6",
    "torchvision>=0.21",
]
llm = ["anthropic>=1.0"]  # 1.0 moved to httpx2; fallbacks "default" arrived in 0.120
edgar = ["edgartools==5.60.0"]
all = ["acceleread[quality,llm,edgar]"]

[project.scripts]
acceleread = "acceleread.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
