[project]
name = "acceleread-eval"
version = "0.1.0.dev0"
description = "Evaluation harness for acceleread (not shipped to users)."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "The acceleread Authors" }]
dependencies = ["acceleread"]

[project.scripts]
acceleread-eval = "acceleread_eval.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
